<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Percobaan 3 - Format Teks</title>
</head>
<body>
    <b>ini merupakan teks tebal</b><br>
    <i>ini merupakan teks italic</i><br>
    <mark>ini merupakan teks dengan highlight</mark><br>
    <small>ini merupakan teks kecil</small><br>
    <sub>ini merupakan teks subscript</sub><br>
    <sup>ini merupakan teks superscript</sup><br>
    <del>ini merupakan teks dicoret</del><br>
    <ins>ini merupakan teks underline</ins><br>
</body>
</html>
