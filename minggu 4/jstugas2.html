<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tugas 2 - Kalkulator Sederhana</title>
</head>
<body>

    <h2>Kalkulator Sederhana</h2>
    
    <table>
        <tr>
            <td>Angka 1</td>
            <td>: <input type="number" id="angka1"></td>
        </tr>
        <tr>
            <td>Angka 2</td>
            <td>: <input type="number" id="angka2"></td>
        </tr>
        <tr>
            <td colspan="2">
                <button type="button" onclick="hitung('+')">Tambah (+)</button>
                <button type="button" onclick="hitung('-')">Kurang (-)</button>
                <button type="button" onclick="hitung('*')">Kali (*)</button>
                <button type="button" onclick="hitung('/')">Bagi (/)</button>
            </td>
        </tr>
    </table>

    <h3 id="hasil"></h3>

    <script>
        function hitung(operator) {
            const input1 = document.getElementById("angka1").value;
            const input2 = document.getElementById("angka2").value;
            const hasilElement = document.getElementById("hasil");

            if (input1 === "" || input2 === "") {
                hasilElement.innerHTML = "Harap masukkan kedua angka!";
                return;
            }

            const angka1 = parseFloat(input1);
            const angka2 = parseFloat(input2);
            let hasil = 0;

            switch (operator) {
                case '+':
                    hasil = angka1 + angka2;
                    break;
                case '-':
                    hasil = angka1 - angka2;
                    break;
                case '*':
                    hasil = angka1 * angka2;
                    break;
                case '/':
                    if (angka2 === 0) {
                        hasilElement.innerHTML = "Error: Pembagian dengan nol!";
                        return;
                    }
                    hasil = angka1 / angka2;
                    break;
                default:
                    hasilElement.innerHTML = "Operator tidak valid!";
                    return;
            }

            hasilElement.innerHTML = "Hasil: <strong>" + hasil + "</strong>";
        }
    </script>
    
</body>
</html>
