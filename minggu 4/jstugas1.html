<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tugas 1 - Pengambil Keputusan Sederhana</title>
</head>
<body>

    <h2>Konversi Nilai Angka ke Huruf</h2>
    
    <label for="nilai">Masukkan Nilai (0-100): </label>
    <input type="number" id="nilai" name="nilai" min="0" max="100">
    <button type="button" onclick="hitungNilai()">Hitung</button>

    <h3 id="hasil"></h3>

    <script>
        function hitungNilai() {
            const inputNilai = document.getElementById("nilai").value;
            const hasilElement = document.getElementById("hasil");
            
            if (inputNilai === "") {
                hasilElement.innerHTML = "Harap masukkan nilai!";
                return;
            }

            const nilai = parseInt(inputNilai);
            let grade = "";

            if (nilai >= 0 && nilai <= 20) {
                grade = "E";
            } else if (nilai >= 21 && nilai <= 40) {
                grade = "D";
            } else if (nilai >= 41 && nilai <= 60) {
                grade = "C";
            } else if (nilai >= 61 && nilai <= 80) {
                grade = "B";
            } else if (nilai >= 81 && nilai <= 100) {
                grade = "A";
            } else {
                grade = "Nilai di luar jangkauan (0-100)";
            }

            if (grade.length === 1) {
                hasilElement.innerHTML = "Hasil Konversi: <strong>" + grade + "</strong>";
            } else {
                hasilElement.innerHTML = grade;
            }
        }
    </script>
    
</body>
</html>
