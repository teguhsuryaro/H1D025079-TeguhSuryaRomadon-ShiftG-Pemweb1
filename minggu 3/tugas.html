<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Registrasi - Tugas Minggu 3</title>
    <link rel="stylesheet" type="text/css" href="tugas.css">
</head>
<body>

    <div class="form-container">
        <h2>Free Registration</h2>
        <form action="proses.php" method="post" name="Form">
            <table>
                <tr>
                    <td class="kolom1"><label for="txtNama">Nama</label></td>
                    <td class="kolom2">:</td>
                    <td class="kolom3"><input type="text" name="txtNama" id="txtNama" placeholder="Masukkan nama lengkap..."></td>
                </tr>
                <tr>
                    <td class="kolom1">Tgl Lahir</td>
                    <td>:</td>
                    <td class="date-group">
                        <input type="text" name="txtTgl" id="txtTgl" maxlength="2" placeholder="DD">
                        <span>/</span>
                        <input type="text" name="txtBulan" id="txtBulan" maxlength="2" placeholder="MM">
                        <span>/</span>
                        <input type="text" name="txtTahun" id="txtTahun" maxlength="4" placeholder="YYYY">
                    </td>
                </tr>
                <tr>
                    <td class="kolom1"><label for="txtAlamat">Alamat</label></td>
                    <td>:</td>
                    <td><textarea name="txtAlamat" id="txtAlamat" placeholder="Masukkan alamat lengkap..."></textarea></td>
                </tr>
                <tr>
                    <td class="kolom1"><label for="txtKota">Kota</label></td>
                    <td>:</td>
                    <td><input type="text" name="txtKota" id="txtKota" placeholder="Masukkan kota..."></td>
                </tr>
                <tr>
                    <td>&nbsp;</td>
                    <td>&nbsp;</td>
                    <td class="btn-container">
                        <input type="submit" name="btnKirim" id="btnKirim" value="Kirim">
                        <input type="reset" name="btnCancel" id="btnCancel" value="Cancel">
                    </td>
                </tr>
            </table>
        </form>
    </div>

</body>
</html>
